; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wemos_d1_mini32

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
; upload_port = /dev/cu.usbserial-1440
upload_port = /dev/cu.usbserial-10
upload_speed = 460800   ;115200 230400 460800 921600
monitor_speed = 115200
; board_build.partitions = partition.csv
lib_deps = 
	bremme/SevenSegmentTM1637@^1.1.0
	iakop/LiquidCrystal_I2C_ESP32@^1.1.6
	fastled/FastLED@^3.5.0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<Timer.cpp> +<Event.cpp>
build_flags = -Itest/mocks -DARDUINO=100
